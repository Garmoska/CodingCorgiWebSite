<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Background -->
  <rect width="100" height="100" fill="#E67E22" rx="15"/>

  <!-- Corgi body (long and low) -->
  <ellipse cx="50" cy="60" rx="28" ry="16" fill="#8B4513"/>

  <!-- Corgi head -->
  <ellipse cx="50" cy="40" rx="18" ry="16" fill="#8B4513"/>

  <!-- White chest marking -->
  <ellipse cx="50" cy="58" rx="14" ry="10" fill="#FFF8DC"/>

  <!-- Left ear (pointy) -->
  <polygon points="38,30 34,18 42,28" fill="#8B4513"/>
  <polygon points="38,30 36,22 40,28" fill="#D2691E"/>

  <!-- Right ear (pointy) -->
  <polygon points="62,30 66,18 58,28" fill="#8B4513"/>
  <polygon points="62,30 64,22 60,28" fill="#D2691E"/>

  <!-- White face markings -->
  <ellipse cx="50" cy="42" rx="12" ry="10" fill="#FFF8DC"/>

  <!-- Snout -->
  <ellipse cx="50" cy="48" rx="8" ry="6" fill="#D2691E"/>

  <!-- Nose -->
  <ellipse cx="50" cy="50" rx="3" ry="2.5" fill="#000"/>

  <!-- Left eye -->
  <circle cx="44" cy="38" r="2.5" fill="#000"/>
  <circle cx="44.5" cy="37.5" r="0.8" fill="#FFF"/>

  <!-- Right eye -->
  <circle cx="56" cy="38" r="2.5" fill="#000"/>
  <circle cx="56.5" cy="37.5" r="0.8" fill="#FFF"/>

  <!-- Smile -->
  <path d="M 46 51 Q 50 53 54 51" stroke="#000" stroke-width="1" fill="none" stroke-linecap="round"/>

  <!-- Short legs (corgi characteristic) -->
  <rect x="36" y="70" width="5" height="10" rx="2" fill="#8B4513"/>
  <rect x="48" y="70" width="5" height="10" rx="2" fill="#8B4513"/>
  <rect x="59" y="70" width="5" height="10" rx="2" fill="#8B4513"/>

  <!-- Paws -->
  <ellipse cx="38.5" cy="80" rx="3" ry="2" fill="#FFF8DC"/>
  <ellipse cx="50.5" cy="80" rx="3" ry="2" fill="#FFF8DC"/>
  <ellipse cx="61.5" cy="80" rx="3" ry="2" fill="#FFF8DC"/>

  <!-- Tail (curved up) -->
  <path d="M 75 62 Q 78 58 78 52 Q 78 48 76 46" stroke="#8B4513" stroke-width="6" fill="none" stroke-linecap="round"/>
  <path d="M 75 62 Q 78 58 78 52 Q 78 48 76 46" stroke="#FFF8DC" stroke-width="3" fill="none" stroke-linecap="round"/>
</svg>
